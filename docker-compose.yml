networks:
  sat_sa_net:
    name: sat_sa_net
    driver: bridge

volumes:
  pgdata:
    name: sat_sa_pgdata
    driver: local
  miniodata:
    name: sat_sa_miniodata
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: sat_sa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satsa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-satsa_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - sat_sa_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-satsa_user} -d ${POSTGRES_DB:-satsa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sat_sa_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY:-minio_admin}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - sat_sa_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sat_sa_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}"
      DATA_PROCESSING_URL: ${DATA_PROCESSING_URL:-http://data_processing:8001}
      ANALYTICS_ENGINE_URL: ${ANALYTICS_ENGINE_URL:-http://analytics_engine:8002}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL:-http://audit_service:8003}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-sat_sa_internal_service_token_2026}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - sat_sa_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  data-processing:
    build:
      context: .
      dockerfile: data_processing/Dockerfile
    container_name: sat_sa_data_processing
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    expose:
      - "${DATA_PROCESSING_PORT:-8001}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      sat_sa_net:
        aliases:
          - data_processing
          - data-processing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  analytics_engine:
    build:
      context: .
      dockerfile: analytics_engine/Dockerfile
    container_name: sat_sa_analytics_engine
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    expose:
      - "${ANALYTICS_ENGINE_PORT:-8002}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      sat_sa_net:
        aliases:
          - analytics_engine
          - analytics-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  audit-service:
    build:
      context: .
      dockerfile: audit_service/Dockerfile
    container_name: sat_sa_audit_service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "${MINIO_SECURE:-false}"
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    expose:
      - "${AUDIT_SERVICE_PORT:-8003}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      sat_sa_net:
        aliases:
          - audit_service
          - audit-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sat_sa_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sat_sa_net
